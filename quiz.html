<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 id="quizTitle">Quiz</h1>
    <div id="quiz">
      <div id="question">Question text</div>
      <div id="choices"></div>
      <button id="nextBtn">Next</button>
    </div>
    <div id="result" class="hidden"></div>
    <button id="restartBtn" class="hidden">Restart Quiz</button>
    <div id="timer">Time Left: <span id="time">30</span>s</div>
    <button onclick="goBack()">Back to Selection</button>
  </div>

  <script>
    if(!localStorage.getItem("loggedInUser")){
      window.location.href="index.html";
    }

    // Quiz data by category
    const quizzes = {
      python: [
  {question:"What is the output of len('Hello')?",choices:["5","4","6","Error"],correct:"5"},
  {question:"Which keyword is used to define a function in Python?",choices:["func","def","function","lambda"],correct:"def"},
  {question:"What is the correct file extension for Python files?",choices:[".py",".pt",".pyt",".pyth"],correct:".py"},
  {question:"Which of the following is a mutable data type in Python?",choices:["tuple","list","string","frozenset"],correct:"list"},
  {question:"What will be the output of 3 ** 2 in Python?",choices:["6","9","8","Error"],correct:"9"},
  {question:"Which built-in function returns the type of an object?",choices:["typeof()","type()","class()","objectType()"],correct:"type()"},
  {question:"How do you insert COMMENTS in Python code?",choices:["/* comment */","// comment","# comment","<-- comment -->"],correct:"# comment"},
  {question:"Which of the following is used to handle exceptions in Python?",choices:["try/except","do/catch","catch/handle","error/except"],correct:"try/except"},
  {question:"What is the output of bool(0)?",choices:["True","False","0","Error"],correct:"False"}
],
      java: [
        {question:"Java is ___ typed language?",choices:["Weakly","Strongly","Dynamically","None"],correct:"Strongly"},
        {question:"Which keyword is used to inherit a class?",choices:["this","extends","super","implements"],correct:"extends"}
      ],
      javascript: [
        {question:"Which language runs in a web browser?",choices:["Java","C","Python","JavaScript"],correct:"JavaScript"},
        {question:"What year was JavaScript launched?",choices:["1996","1995","1994","None of the above"],correct:"1995"}
      ]
    };

    const type=localStorage.getItem("quizType")||"javascript";
    document.getElementById("quizTitle").textContent=type.toUpperCase()+" Quiz";
    const quizData=quizzes[type];

    let currentQuestion=0,score=0,timeLeft=30,timer;

    const questionEl=document.getElementById("question");
    const choicesEl=document.getElementById("choices");
    const nextBtn=document.getElementById("nextBtn");
    const resultEl=document.getElementById("result");
    const timeEl=document.getElementById("time");
    const restartBtn=document.getElementById("restartBtn");
    const quizContainer=document.getElementById("quiz");

    function startQuiz(){
      showQuestion();
      startTimer();
      nextBtn.style.display="none";
      resultEl.classList.add("hidden");
    }

    function showQuestion(){
      const q=quizData[currentQuestion];
      questionEl.textContent=q.question;
      choicesEl.innerHTML="";
      q.choices.forEach(choice=>{
        const btn=document.createElement("button");
        btn.textContent=choice;
        btn.addEventListener("click",()=>selectAnswer(btn,q.correct));
        choicesEl.appendChild(btn);
      });
    }

    function selectAnswer(button,correctAnswer){
      const selected=button.textContent;
      Array.from(choicesEl.children).forEach(btn=>{
        btn.disabled=true;
        if(btn.textContent===correctAnswer){btn.style.borderColor="#00ffcc";}
        if(btn.textContent===selected && selected!==correctAnswer){btn.style.borderColor="#ff4d4d";}
      });
      if(selected===correctAnswer){score++;}
      nextBtn.style.display="inline-block";
    }

    function nextQuestion(){
      currentQuestion++;
      if(currentQuestion<quizData.length){
        showQuestion();
        nextBtn.style.display="none";
      }else{
        endQuiz();
      }
    }

    function startTimer(){
      timeEl.textContent=timeLeft;
      timer=setInterval(()=>{
        timeLeft--;
        timeEl.textContent=timeLeft;
        if(timeLeft<=0){
          clearInterval(timer);
          endQuiz();
        }
      },1000);
    }

    function endQuiz(){
      clearInterval(timer);
      quizContainer.classList.add("hidden");
      resultEl.textContent=`You scored ${score} out of ${quizData.length}!`;
      resultEl.classList.remove("hidden");
      restartBtn.classList.remove("hidden");
    }

    nextBtn.addEventListener("click",nextQuestion);

    restartBtn.addEventListener("click",()=>{
      currentQuestion=0;score=0;timeLeft=30;
      resultEl.classList.add("hidden");
      restartBtn.classList.add("hidden");
      quizContainer.classList.remove("hidden");
      timeEl.textContent=timeLeft;
      startQuiz();
    });

    function goBack(){
      window.location.href="select.html";
    }

    startQuiz();
  </script>
</body>
</html>
